name: Build and Release NumOS

on:
  push:
    branches:
      - main
  # Manual release: lets an agent cut a release without a new commit. The run
  # number still supplies the patch, so every run publishes a unique version.
  workflow_dispatch:

jobs:
  build:
    # Advanced Filter
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'no build') && !contains(github.event.head_commit.message, '[no build]') && !contains(github.event.head_commit.message, '[SKIP CI]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Force a deterministic build tree on Linux. This overrides the Windows-only
      # `build_dir = C:/.piobuild/numOS` in platformio.ini, so both the build and the
      # rename step agree on where firmware.bin lands.
      PLATFORMIO_BUILD_DIR: .pio/build
      # scripts/build_metadata.py appends this to the VERSION file to form
      # NUMOS_VERSION and we tag the exact same string. github.run_number is
      # monotonic, so every released image has a strictly increasing semver and
      # the device can trust its embedded version against the release tag.
      NUMOS_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < VERSION)"
          VER="${BASE}.${NUMOS_BUILD_NUMBER}"
          echo "NUMOS_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "Resolved release version: v${VER}"

      - name: Patch platformio.ini for Ubuntu
        # Remove the Windows-only build_dir (e.g. `build_dir = C:/.piobuild/numOS`) so it
        # can't leak into the Linux build. The previous pattern looked for a backslash
        # (`C:\`) while the file uses a forward slash (`C:/`), so it never matched and the
        # firmware was written under ./C:/.piobuild/... instead of .pio/build/...
        # PLATFORMIO_BUILD_DIR (job env) already overrides this; stripping the line keeps
        # the effective config clean in CI logs.
        run: |
          sed -i -E '/^[[:space:]]*build_dir[[:space:]]*=[[:space:]]*[A-Za-z]:/d' platformio.ini
          echo "[platformio] section after patch:"
          sed -n '/^\[platformio\]/,/^\[/p' platformio.ini

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Build NumOS (PlatformIO)
        # Compila específicamente el entorno del ESP32-S3 (CAM target). The OTA
        # update path writes the resulting app image into the spare ota_1 bank.
        run: pio run -e esp32s3_n16r8

      - name: Locate and rename firmware
        run: |
          set -euo pipefail

          echo "::group::Firmware discovery debug"
          echo "pwd                 : $(pwd)"
          echo "pio env             : esp32s3_n16r8"
          echo "PLATFORMIO_BUILD_DIR: ${PLATFORMIO_BUILD_DIR:-<unset>}"
          echo "NUMOS_VERSION       : ${NUMOS_VERSION}"
          echo "--- listing of expected build dir ---"
          ls -la "${PLATFORMIO_BUILD_DIR:-.pio/build}/esp32s3_n16r8" 2>/dev/null \
            || echo "  (expected build dir not present)"
          echo "--- find firmware.bin (project tree) ---"
          find . -path '*esp32s3_n16r8/firmware.bin' -type f 2>/dev/null || true
          echo "::endgroup::"

          # Check the most likely locations first, then fall back to a narrow find.
          FW=""
          for cand in \
            "${PLATFORMIO_BUILD_DIR:-}/esp32s3_n16r8/firmware.bin" \
            ".pio/build/esp32s3_n16r8/firmware.bin"; do
            if [ -n "$cand" ] && [ -f "$cand" ]; then
              FW="$cand"
              break
            fi
          done

          if [ -z "$FW" ]; then
            FW="$(find . -path '*esp32s3_n16r8/firmware.bin' -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$FW" ] || [ ! -f "$FW" ]; then
            echo "::error::Could not locate firmware.bin for env esp32s3_n16r8 after a successful build."
            exit 1
          fi

          echo "Resolved firmware: $FW"
          # The asset name is STABLE and single: the firmware fetches
          # /releases/latest/download/NumOS.bin, so renaming it per release
          # would break over-the-air updates.
          cp "$FW" NumOS.bin
          SHA="$(sha256sum NumOS.bin | cut -d' ' -f1)"
          echo "FIRMWARE_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "Created release artifact: NumOS.bin"
          echo "SHA256: $SHA"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v${{ env.NUMOS_VERSION }}"
          name: "NumOS v${{ env.NUMOS_VERSION }}"
          artifacts: "NumOS.bin"
          allowUpdates: true
          # Stable releases only: /releases/latest (and therefore the device's
          # OTA check) must resolve to this one.
          makeLatest: true
          prerelease: false
          body: |
            ## NumOS v${{ env.NUMOS_VERSION }}

            Over-the-air update supported. On the calculator: **Settings → System Update**.

            ### Manual installation
            1. Download `NumOS.bin` from the **Assets** section.
            2. Flash it to your **ESP32-S3 N16R8** device at offset `0x10000`.
               (A first OTA-capable unit also needs the new partition table flashed once.)

            ### Build details
            - **Version:** `v${{ env.NUMOS_VERSION }}`
            - **Commit:** ${{ github.sha }}
            - **SHA256:** `${{ env.FIRMWARE_SHA256 }}`

            > [!IMPORTANT]
            > The "Source code" files below are automatically generated and are not required for flashing.
